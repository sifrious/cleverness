# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Organization-wide defaults for repositories without their own configuration.
# A repository can keep deliberate local settings in its own .coderabbit.yaml.
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

chat:
  auto_reply: true
